{% extends "vault/base.html" %}
{% block title %}Edit Category — DocuVault AI{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto light-card rounded-2xl p-6 space-y-5 animate-fade-up">
  <div class="flex items-center justify-between border-b border-slate-200 pb-4">
    <h1 class="text-base font-bold text-slate-900">Edit Category: {{ category.name }}</h1>
    <a href="{% url 'categories_list' %}" class="text-xs font-semibold text-slate-500 hover:text-slate-800">Back</a>
  </div>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Name</label>
      {{ form.name }}
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Badge Color</label>
      {{ form.color }}
    </div>
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Description</label>
      {{ form.description }}
    </div>
    <label class="flex items-center space-x-2 text-xs font-medium text-slate-700 cursor-pointer">
      {{ form.is_hidden }}
      <span>Hide from dropdown filters</span>
    </label>
    <div class="flex justify-end space-x-2 pt-3 border-t border-slate-200">
      <a href="{% url 'categories_list' %}" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</a>
      <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
